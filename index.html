<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=portal_he.html">
  <title>מעבר לפורטל ההדגמות</title>
  <script>
    window.location.replace("portal_he.html");
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f9fc;
      --ink: #172033;
      --muted: #607086;
      --line: #d9e2ec;
      --blue: #1d64d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      direction: rtl;
      text-align: center;
      background: linear-gradient(180deg, #f8fafc 0%, #edf3f9 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 32px, 560px);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 18px 45px rgba(29, 44, 73, 0.11);
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-top: 18px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue);
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid rgba(29, 100, 216, 0.34);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>מעבירים לפורטל ההדגמות</h1>
    <p>אם המעבר לא התרחש אוטומטית, אפשר לפתוח את הפורטל ידנית.</p>
    <a href="portal_he.html">פתיחת הפורטל</a>
  </main>
</body>
</html>
